services:
  - type: web
    name: jardines-del-cerro-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PAYPAL_MODE
        value: sandbox
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: ECF_API_KEY
        sync: false
      - key: ECF_API_BASE_URL
        sync: false
      - key: ECF_RNC_EMISOR
        sync: false
      - key: ECF_ENVIRONMENT
        value: live
