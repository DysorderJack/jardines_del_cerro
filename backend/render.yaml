services:
  - type: web
    name: jardines-del-cerro-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: PAYPAL_MODE
        value: sandbox
